<!doctype html>
<meta charset="utf-8">
<title>webgl</title>
<!-- A full-viewport fragment shader redrawn every frame: GPU-produced pixels, the case where the
     default offscreen path's GPU->CPU readback could cost more than a shared texture's. -->
<style>html,body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
canvas.width = innerWidth * devicePixelRatio;
canvas.height = innerHeight * devicePixelRatio;
const gl = canvas.getContext("webgl");
const shader = (type, source) => { const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s; };
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, "attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}"));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER,
  "precision mediump float;uniform float t;uniform vec2 r;void main(){vec2 u=gl_FragCoord.xy/r;" +
  "gl_FragColor=vec4(0.5+0.5*sin(t+u.x*40.0),0.5+0.5*sin(t*1.3+u.y*30.0),0.5+0.5*sin(t*0.7+(u.x+u.y)*20.0),1);}"));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const p = gl.getAttribLocation(program, "p");
gl.enableVertexAttribArray(p);
gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
const t = gl.getUniformLocation(program, "t");
gl.uniform2f(gl.getUniformLocation(program, "r"), canvas.width, canvas.height);
function frame(now) { gl.uniform1f(t, now / 1000); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
