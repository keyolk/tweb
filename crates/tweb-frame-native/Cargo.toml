[package]
name = "tweb-frame-native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# A Node-API addon the Electron engine loads, not a library any crate links against. It is built
# by `tweb-pane`'s build script and embedded next to the app code; see that build.rs for why.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
