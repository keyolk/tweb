[package]
name = "twebd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "twebd"
path = "src/lib.rs"

[[bin]]
name = "twebd"
path = "src/main.rs"

[dependencies]
tweb-core.workspace = true
tweb-platform.workspace = true
tweb-agent.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
uuid.workspace = true

[dev-dependencies]
# `test-util` lets the READY-handshake test wait out the real ten-second timeout in virtual time,
# so the regression it guards is covered without adding ten seconds to every `make check`.
tokio = { version = "1", features = ["full", "test-util"] }
