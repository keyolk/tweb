[workspace]
resolver = "2"
members = [
    "crates/tweb-core",
    "crates/twebd",
    "crates/tweb-pane",
    "crates/tweb-engine/electron",
    "crates/tweb-engine/tauri",
    "crates/tweb-platform",
    "crates/tweb-agent",
    "crates/tweb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["keyolk"]

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# error
thiserror = "1"
anyhow = "1"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# misc
bytes = "1"
parking_lot = "0.12"
once_cell = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# internal
tweb-core = { path = "crates/tweb-core" }
tweb-platform = { path = "crates/tweb-platform" }
tweb-agent = { path = "crates/tweb-agent" }
tweb-pane = { path = "crates/tweb-pane" }
twebd = { path = "crates/twebd" }
